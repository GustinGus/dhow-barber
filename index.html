<style>
/* ============ TOKENS — extraídos da logo ============ */
:root{
  --ink:#14120E;        /* preto quente do anel da logo */
  --ink-70:rgba(20,18,14,.7);
  --ink-45:rgba(20,18,14,.45);
  --ink-14:rgba(20,18,14,.14);
  --ink-08:rgba(20,18,14,.08);
  --cream:#FBF6E7;      /* interior da logo */
  --paper:#F4EEDC;
  --sage:#646755;       /* folhagem */
  --sage-2:#8E9A7C;
  --sage-3:#CFD2C0;
  --amber:#E07B1E;      /* cabo do pincel da logo */
  --amber-d:#A85A10;
  --amber-08:rgba(224,123,30,.08);
  --amber-18:rgba(224,123,30,.18);
  --ok:#4F7A46; --warn:#B08415; --bad:#9E3B2A;
  --serif:'Cormorant',Georgia,serif;
  --sans:'Jost','Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --rs:10px;
  --shell:min(1120px,100% - 2.5rem);
  --nav-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.08;margin:0}
h1{font-size:clamp(2.9rem,10vw,4.6rem);font-weight:300}
h2{font-size:clamp(2.1rem,6.4vw,3rem);font-weight:300}
h3{font-size:1.45rem}
p{margin:0 0 1rem}
.shell{width:var(--shell);margin-inline:auto}
.hide{display:none !important}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}
::selection{background:var(--amber-18)}

/* ============ BOTÕES ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  padding:1.05rem 1.7rem;border-radius:999px;border:1px solid transparent;background:none;
  cursor:pointer;text-decoration:none;transition:transform .18s,background .2s,border-color .2s,color .2s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--amber);color:#1A1206;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.btn-primary:hover{background:#F08B2C}
.btn-ghost{border-color:var(--ink-14);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);background:var(--ink-08)}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-ink:hover{background:#25231C}
.btn-sm{padding:.62rem 1.05rem;font-size:.68rem;letter-spacing:.14em}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn-block{width:100%}

/* ============ NAV ============ */
.nav{
  position:sticky;top:0;z-index:60;height:var(--nav-h);
  background:rgba(251,246,231,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--ink-08);
}
.nav-in{display:flex;align-items:center;gap:1.4rem;height:100%;width:var(--shell);margin-inline:auto}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;margin-right:auto}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{font-family:var(--serif);font-size:1.24rem;font-weight:500;letter-spacing:.01em}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-links a{font-size:.86rem;text-decoration:none;color:var(--ink-70);position:relative;padding:.2rem 0}
.nav-links a:hover{color:var(--ink)}
.nav-links a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;background:var(--amber);transition:right .25s}
.nav-links a:hover::after{right:0}
.nav-cta{padding:.7rem 1.15rem;font-size:.7rem}
.burger{display:none;background:none;border:0;padding:.5rem;cursor:pointer}
.burger svg{width:24px;height:24px}
.drawer{position:fixed;inset:var(--nav-h) 0 auto;background:var(--cream);border-bottom:1px solid var(--ink-08);padding:1rem 0 1.6rem;z-index:59;transform:translateY(-12px);opacity:0;pointer-events:none;transition:.22s}
.drawer.open{transform:none;opacity:1;pointer-events:auto}
.drawer a{display:block;padding:.85rem 0;text-decoration:none;border-bottom:1px solid var(--ink-08);font-size:1.05rem}

/* ============ BOTÂNICA (SVG) ============ */
.botanic{position:absolute;pointer-events:none;color:var(--sage-2);opacity:.5;z-index:0}
.botanic svg{width:100%;height:auto;display:block}
.leafline{stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round}
.leaf{fill:currentColor}
.divider{display:flex;align-items:center;justify-content:center;gap:1.1rem;padding:3.2rem 0 .5rem;color:var(--sage-2)}
.divider .rule{height:1px;background:linear-gradient(90deg,transparent,var(--sage-3));flex:1;max-width:180px}
.divider .rule.r{background:linear-gradient(270deg,transparent,var(--sage-3))}
.divider svg{width:66px;opacity:.85}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;padding:clamp(2.6rem,7vw,5rem) 0 clamp(3rem,7vw,5.5rem);background:
  radial-gradient(120% 80% at 78% 0%,rgba(207,210,192,.34),transparent 60%),var(--cream)}
.hero-in{position:relative;z-index:2;display:grid;gap:2.2rem;align-items:center}
.hero-mark{width:132px;height:132px;border-radius:50%;box-shadow:0 12px 40px rgba(20,18,14,.16)}
.hero h1{margin:.2rem 0 .1rem}
.hero .lede{font-size:1.08rem;color:var(--ink-70);max-width:34ch;margin-bottom:1.6rem}
.hero .kicker{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--sage);margin:.9rem 0 .3rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:.7rem}
.rating{display:flex;align-items:center;gap:.6rem;margin-top:1.9rem;font-size:.9rem;color:var(--ink-70)}
.rating b{font-family:var(--serif);font-size:1.5rem;font-weight:500;color:var(--ink)}
.stars{color:var(--amber);letter-spacing:.12em;font-size:.9rem}
.hero-bot-r{top:-40px;right:-90px;width:340px}
.hero-bot-l{bottom:-70px;left:-110px;width:300px;opacity:.38}

/* ============ SEÇÕES ============ */
.section{position:relative;padding:clamp(3.4rem,8vw,5.6rem) 0;overflow:hidden}
.section-ink{background:var(--ink);color:var(--cream)}
.section-paper{background:var(--paper)}
.sec-head{max-width:52ch;margin-bottom:2.4rem;position:relative;z-index:2}
.sec-head p{color:var(--ink-70);margin:.7rem 0 0;font-size:1.02rem}
.section-ink .sec-head p{color:rgba(251,246,231,.62)}

/* ============ SERVIÇOS (menu, não cards) ============ */
.menu{position:relative;z-index:2;border-top:1px solid var(--ink-14)}
.menu-item{display:grid;grid-template-columns:1fr auto;gap:.4rem 1.4rem;align-items:center;
  padding:1.5rem .2rem;border-bottom:1px solid var(--ink-14);transition:background .2s}
.menu-item:hover{background:rgba(20,18,14,.028)}
.mi-name{font-family:var(--serif);font-size:1.7rem;line-height:1.1;display:flex;align-items:center;gap:.6rem}
.mi-desc{grid-column:1/2;color:var(--ink-70);font-size:.94rem;max-width:46ch;margin-top:.3rem}
.mi-side{grid-column:2;grid-row:1/3;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.6rem}
.mi-price{font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
.mi-price.todo{font-family:var(--sans);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45)}
.mi-dur{font-size:.8rem;color:var(--sage);letter-spacing:.04em}
.svc-note{margin-top:1.4rem;font-size:.88rem;color:var(--ink-45)}

/* ============ CARROSSEL PORTFÓLIO ============ */
.carousel-wrap{position:relative;z-index:2}
.carousel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:.4rem 0 1.4rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(300px,72vw);scroll-snap-align:center;position:relative;border-radius:var(--r);overflow:hidden;
  background:#221F19;aspect-ratio:4/5;cursor:zoom-in;border:1px solid rgba(251,246,231,.1)}
.slide img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.slide:hover img{transform:scale(1.045)}
.slide figcaption{position:absolute;left:0;right:0;bottom:0;padding:2.4rem .9rem .85rem;font-size:.86rem;
  color:#F7F2E3;background:linear-gradient(transparent,rgba(12,11,8,.82))}
.car-nav{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
.car-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(251,246,231,.24);background:none;color:inherit;
  display:grid;place-items:center;cursor:pointer;transition:.2s}
.car-btn:hover{background:rgba(251,246,231,.1);border-color:var(--amber);color:var(--amber)}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(251,246,231,.28);border:0;padding:0;cursor:pointer;transition:.25s}
.dot.on{background:var(--amber);width:20px;border-radius:3px}
.pf-foot{margin-top:1.8rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.4rem}
.pf-foot p{margin:0;color:rgba(251,246,231,.62);font-size:.95rem}

/* lightbox */
.lb{position:fixed;inset:0;z-index:120;background:rgba(10,9,7,.94);display:grid;place-items:center;padding:1rem}
.lb img{max-height:74vh;max-width:min(760px,94vw);border-radius:10px}
.lb figcaption{color:#EFE9D9;text-align:center;margin-top:1rem;font-size:.95rem;max-width:60ch}
.lb-x{position:absolute;top:1rem;right:1rem}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%)}
.lb-arrow.l{left:.6rem} .lb-arrow.r{right:.6rem}
.lb .car-btn{background:rgba(251,246,231,.08);color:#EFE9D9}

/* ============ AVALIAÇÕES ============ */
.quotes{display:grid;gap:1.2rem;position:relative;z-index:2;grid-template-columns:1fr}
.quote{padding:1.6rem 1.5rem;background:var(--cream);border-radius:var(--r);border:1px solid var(--ink-08)}
.quote p{font-family:var(--serif);font-size:1.3rem;font-style:italic;line-height:1.4;margin:0 0 .7rem}
.quote span{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.rating-big{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.4rem}
.rating-big b{font-family:var(--serif);font-size:3.4rem;font-weight:400;line-height:1}

/* ============ LOCALIZAÇÃO / CONTATO ============ */
.split{display:grid;gap:2.6rem;position:relative;z-index:2}
.addr{font-family:var(--serif);font-size:1.5rem;line-height:1.45}
.contact-list{display:grid;gap:.2rem;margin:1.4rem 0 1.6rem;border-top:1px solid var(--ink-14)}
.contact-list a{display:flex;align-items:center;gap:.9rem;padding:1rem .2rem;border-bottom:1px solid var(--ink-14);
  text-decoration:none;transition:.2s}
.contact-list a:hover{padding-left:.7rem;color:var(--amber-d)}
.contact-list svg{width:19px;height:19px;color:var(--sage);flex:none}
.contact-list small{display:block;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45)}

/* ============ FOOTER ============ */
.footer{position:relative;background:var(--ink);color:rgba(251,246,231,.72);padding:3.6rem 0 2rem;overflow:hidden}
.footer h4{font-family:var(--serif);color:var(--cream);font-size:1.9rem;font-weight:400;margin-bottom:.5rem}
.foot-grid{display:grid;gap:2rem;position:relative;z-index:2}
.foot-grid a{color:rgba(251,246,231,.72);text-decoration:none;display:block;padding:.28rem 0}
.foot-grid a:hover{color:var(--amber)}
.foot-title{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(251,246,231,.42);margin-bottom:.6rem}
.foot-bot{margin-top:2.6rem;padding-top:1.2rem;border-top:1px solid rgba(251,246,231,.13);
  display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;justify-content:space-between;font-size:.82rem;position:relative;z-index:2}
.foot-bot a{color:var(--sage-2)}

/* ============ AGENDAMENTO ============ */
.page{min-height:calc(100vh - var(--nav-h));padding:2rem 0 5rem;position:relative;overflow:hidden}
.steps{display:flex;gap:.35rem;margin:1.2rem 0 2rem;position:relative;z-index:2}
.step-pip{flex:1;min-width:0}
.step-pip .bar{height:3px;border-radius:2px;background:var(--ink-14);transition:background .3s}
.step-pip.done .bar{background:var(--sage-2)}
.step-pip.now .bar{background:var(--amber)}
.step-pip span{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-45);
  margin-top:.45rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-pip.now span{color:var(--ink)}
.step-head{margin-bottom:1.5rem;position:relative;z-index:2}
.step-head h2{font-size:clamp(1.9rem,5.5vw,2.5rem)}
.step-head p{color:var(--ink-70);margin:.5rem 0 0}
.stage{position:relative;z-index:2;animation:stepin .32s ease both}
@keyframes stepin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.pick-list{display:grid;gap:.7rem}
.pick{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.9rem;text-align:left;width:100%;
  padding:1.15rem 1.25rem;border:1px solid var(--ink-14);border-radius:var(--r);background:var(--cream);
  cursor:pointer;transition:border-color .18s,background .18s,transform .18s}
.pick:hover{border-color:var(--sage-2)}
.pick.on{border-color:var(--amber);background:var(--amber-08);box-shadow:inset 0 0 0 1px var(--amber)}
.pick strong{font-family:var(--serif);font-size:1.35rem;font-weight:500;display:block}
.pick small{color:var(--ink-70);font-size:.87rem}
.pick .tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--ink-14);display:grid;place-items:center;color:transparent;flex:none}
.pick.on .tick{background:var(--amber);border-color:var(--amber);color:#1A1206}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.pay{display:grid;place-items:center;gap:.5rem;padding:1.3rem .6rem;border:1px solid var(--ink-14);border-radius:var(--r);
  background:var(--cream);cursor:pointer;transition:.18s;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.pay svg{width:26px;height:26px;color:var(--sage)}
.pay:hover{border-color:var(--sage-2)}
.pay.on{border-color:var(--amber);background:var(--amber-08);color:var(--amber-d)}
.pay.on svg{color:var(--amber-d)}

.week{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;padding:.85rem .3rem;border:1px solid var(--ink-14);border-radius:12px;background:var(--cream);
  text-align:center;cursor:pointer;transition:.18s}
.day em{display:block;font-style:normal;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45)}
.day b{display:block;font-family:var(--serif);font-size:1.7rem;font-weight:400;line-height:1.2}
.day small{display:block;font-size:.62rem;color:var(--sage);letter-spacing:.06em}
.day:hover:not(.off){border-color:var(--sage-2)}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.day.on em,.day.on small{color:var(--sage-2)}
.day.off{opacity:.34;cursor:not-allowed;background:transparent}
.day.off small{color:var(--ink-45)}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.9rem}
.week-nav b{font-family:var(--serif);font-size:1.2rem;font-weight:500;text-transform:capitalize}
.mini-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink-14);background:none;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.mini-btn:hover{border-color:var(--ink);background:var(--ink-08)}
.mini-btn[disabled]{opacity:.3;pointer-events:none}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.6rem}
.slot{padding:.95rem .4rem;border:1px solid var(--ink-14);border-radius:10px;background:var(--cream);cursor:pointer;
  font-size:1rem;font-variant-numeric:tabular-nums;transition:.16s}
.slot:hover{border-color:var(--sage-2)}
.slot.on{background:var(--amber);border-color:var(--amber);color:#1A1206;font-weight:500}

.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-45);margin-bottom:.45rem}
.field input,.field textarea,.field select{width:100%;padding:.95rem 1rem;border:1px solid var(--ink-14);border-radius:var(--rs);
  background:var(--cream);font-size:1rem;transition:.18s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--amber);outline:none}
.field textarea{resize:vertical;min-height:88px}
.field .err{color:var(--bad);font-size:.82rem;margin-top:.35rem;display:none}
.field.bad input,.field.bad textarea{border-color:var(--bad)}
.field.bad .err{display:block}

.summary{border:1px solid var(--ink-14);border-radius:var(--r);overflow:hidden;background:var(--cream)}
.sum-row{display:flex;justify-content:space-between;gap:1.4rem;padding:.95rem 1.2rem;border-bottom:1px solid var(--ink-08)}
.sum-row:last-child{border:0}
.sum-row span{color:var(--ink-45);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;flex:none}
.sum-row b{font-weight:400;text-align:right}
.nav-btns{display:flex;gap:.7rem;margin-top:1.8rem;position:relative;z-index:2}
.nav-btns .btn-primary{flex:1}
.nav-btns .btn-ghost svg{width:18px;height:18px}
.nav-btns .btn-ghost:has(>svg:only-child){padding-inline:1.1rem;flex:none}
.link-back{background:none;border:1px solid var(--ink-14);border-radius:999px;color:var(--ink-70);cursor:pointer;
  font-size:.88rem;display:inline-flex;align-items:center;gap:.45rem;padding:.55rem 1.1rem .55rem .85rem;margin-bottom:1rem;
  transition:.18s}
.link-back:hover{color:var(--ink);border-color:var(--ink);background:var(--ink-08)}
.link-back svg{width:17px;height:17px;flex:none}

.done-card{text-align:center;max-width:520px;margin:1rem auto;position:relative;z-index:2}
.done-mark{width:78px;height:78px;border-radius:50%;background:var(--amber-18);color:var(--amber-d);display:grid;place-items:center;
  margin:0 auto 1.4rem;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.msg-box{background:var(--paper);border:1px solid var(--ink-14);border-radius:var(--r);padding:1.1rem;
  text-align:left;white-space:pre-wrap;font-size:.9rem;line-height:1.6;max-height:230px;overflow:auto}
.notice{display:flex;gap:.8rem;padding:1rem 1.1rem;border-radius:var(--rs);background:var(--amber-08);
  border:1px solid var(--amber-18);font-size:.9rem;line-height:1.5;margin:1rem 0}
.notice svg{width:20px;height:20px;flex:none;color:var(--amber-d);margin-top:.15rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--ink-45)}
.empty svg{width:40px;height:40px;color:var(--sage-3);margin-bottom:.8rem}

/* status */
.tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.32rem .6rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.t-pendente{color:var(--warn)} .t-confirmado{color:var(--ok)} .t-recusado{color:var(--bad)}
.t-reagendamento{color:var(--amber-d)} .t-concluido{color:var(--sage)} .t-cancelado{color:var(--ink-45)}

.appt{border:1px solid var(--ink-14);border-radius:var(--r);padding:1.15rem 1.2rem;background:var(--cream);margin-bottom:.8rem;
  cursor:pointer;transition:.18s}
.appt:hover{border-color:var(--sage-2)}
.appt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:.5rem}
.appt-when{font-family:var(--serif);font-size:1.45rem}
.appt-meta{display:flex;flex-wrap:wrap;gap:.4rem 1rem;color:var(--ink-70);font-size:.88rem}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,18,14,.62);z-index:130;display:grid;place-items:end center;padding:0}
.modal{background:var(--cream);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.6rem 1.4rem 2rem;
  animation:up .28s cubic-bezier(.2,.9,.3,1) both}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:1rem}
.modal-x{position:absolute;top:.8rem;right:.9rem}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);color:var(--cream);
  padding:.85rem 1.3rem;border-radius:999px;font-size:.9rem;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.28);
  animation:up .25s both}

/* ============ ADMIN (contexto escuro) ============ */
.admin{background:var(--ink);color:var(--cream);min-height:100vh}
.admin *::selection{background:var(--amber);color:#1A1206}
.admin .shell{width:min(1180px,100% - 2rem)}
.adm-top{position:sticky;top:0;z-index:50;background:rgba(20,18,14,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(251,246,231,.12);padding:.7rem 0}
.adm-top-in{display:flex;align-items:center;gap:1rem}
.adm-top img{width:34px;height:34px;border-radius:50%}
.adm-top b{font-family:var(--serif);font-size:1.1rem;font-weight:500}
.adm-top .sp{margin-left:auto}
.adm-tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.6rem 0;scrollbar-width:none;border-bottom:1px solid rgba(251,246,231,.1)}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tab{flex:none;padding:.5rem .9rem;border-radius:999px;border:1px solid transparent;background:none;color:rgba(251,246,231,.6);
  cursor:pointer;font-size:.86rem;white-space:nowrap;transition:.18s}
.adm-tab:hover{color:var(--cream)}
.adm-tab.on{background:rgba(251,246,231,.08);color:var(--cream);border-color:rgba(251,246,231,.16)}
.adm-body{padding:1.8rem 0 5rem}
.adm-body h2{color:var(--cream);margin-bottom:.3rem}
.adm-sub{color:rgba(251,246,231,.5);margin-bottom:1.6rem;font-size:.95rem}
.card{background:#1E1C16;border:1px solid rgba(251,246,231,.11);border-radius:var(--r);padding:1.25rem}
.grid-4{display:grid;gap:.8rem;grid-template-columns:repeat(2,1fr)}
.stat b{display:block;font-family:var(--serif);font-size:2.5rem;font-weight:400;line-height:1}
.stat span{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(251,246,231,.5)}
.stat.hot b{color:var(--amber)}
.adm-list{display:grid;gap:.7rem}
.row{background:#1E1C16;border:1px solid rgba(251,246,231,.11);border-radius:var(--r);padding:1rem 1.1rem}
.row.clickable{cursor:pointer;transition:.18s}
.row.clickable:hover{border-color:var(--amber);background:#232019}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
.row-time{font-family:var(--serif);font-size:1.4rem;font-variant-numeric:tabular-nums}
.row-meta{color:rgba(251,246,231,.58);font-size:.86rem;display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.35rem}
.admin .field label{color:rgba(251,246,231,.5)}
.admin .field input,.admin .field textarea,.admin .field select{background:#14120E;border-color:rgba(251,246,231,.18);color:var(--cream)}
.admin .btn-ghost{border-color:rgba(251,246,231,.24);color:var(--cream)}
.admin .btn-ghost:hover{background:rgba(251,246,231,.09);border-color:var(--cream)}
.admin .modal{background:#1E1C16;color:var(--cream)}
.admin .empty{color:rgba(251,246,231,.42)}
.admin .tag{opacity:.95}
.admin .t-concluido{color:var(--sage-2)} .admin .t-cancelado{color:rgba(251,246,231,.45)}
.admin .t-pendente{color:#E3B84A} .admin .t-confirmado{color:#87C079}
.check{display:flex;gap:.8rem;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid rgba(251,246,231,.09);font-size:.93rem}
.check:last-child{border:0}
.check .bx{width:20px;height:20px;border-radius:6px;border:1px solid rgba(251,246,231,.3);flex:none;display:grid;place-items:center;margin-top:.15rem}
.check.ok .bx{background:var(--sage);border-color:var(--sage);color:#14120E}
.check.ok{color:rgba(251,246,231,.45);text-decoration:line-through}
.day-row{display:grid;grid-template-columns:auto 1fr;gap:.7rem 1rem;align-items:center;padding:.75rem 0;border-bottom:1px solid rgba(251,246,231,.09)}
.day-row .times{display:flex;gap:.5rem;align-items:center;justify-self:end}
.day-row input[type=time]{width:112px;padding:.5rem .6rem}
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:999px;background:rgba(251,246,231,.18);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--cream);transition:.2s}
.sw input:checked + i{background:var(--amber)}
.sw input:checked + i::after{transform:translateX(19px)}
.agenda-week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:.5rem;overflow-x:auto}
.agenda-col{min-height:120px}
.agenda-col h5{margin:0 0 .5rem;font-family:var(--sans);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(251,246,231,.5);text-align:center;padding-bottom:.4rem;border-bottom:1px solid rgba(251,246,231,.12)}
.agenda-col h5 b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--cream);letter-spacing:0}
.chip{background:#232019;border-left:2px solid var(--amber);border-radius:6px;padding:.45rem .55rem;margin-bottom:.4rem;
  font-size:.76rem;cursor:pointer;transition:.15s}
.chip:hover{background:#2C281F}
.chip b{display:block;font-variant-numeric:tabular-nums;font-weight:500}
.chip span{color:rgba(251,246,231,.6);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.s-confirmado{border-color:#87C079} .chip.s-pendente{border-color:#E3B84A}
.chip.s-concluido{border-color:var(--sage)} .chip.s-cancelado,.chip.s-recusado{border-color:rgba(251,246,231,.25);opacity:.55}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.mcell{aspect-ratio:1;border:1px solid rgba(251,246,231,.1);border-radius:8px;padding:.35rem;font-size:.78rem;cursor:pointer;
  display:flex;flex-direction:column;gap:.2rem;background:#1A1813;transition:.15s}
.mcell:hover{border-color:var(--amber)}
.mcell.out{opacity:.28}
.mcell.today{border-color:var(--amber)}
.mcell b{font-variant-numeric:tabular-nums;font-weight:400}
.mcell i{font-style:normal;font-size:.66rem;color:var(--amber);margin-top:auto}
.mdow{text-align:center;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(251,246,231,.4);padding-bottom:.3rem}
.pf-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem}
.pf-thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;background:#14120E;border:1px solid rgba(251,246,231,.12)}
.pf-thumb img{width:100%;height:100%;object-fit:cover}
.pf-thumb.off img{opacity:.3;filter:grayscale(1)}
.pf-tools{position:absolute;inset:auto 0 0;display:flex;gap:.25rem;padding:.35rem;background:linear-gradient(transparent,rgba(10,9,7,.9))}
.pf-tools button{flex:1;background:rgba(251,246,231,.14);border:0;color:var(--cream);border-radius:6px;padding:.32rem;cursor:pointer;
  display:grid;place-items:center}
.pf-tools button:hover{background:var(--amber);color:#1A1206}
.pf-tools svg{width:15px;height:15px}
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--ink)}
.login-box{width:min(380px,100%);text-align:center}
.login-box img{width:82px;height:82px;border-radius:50%;margin:0 auto 1.4rem}
.tabs-sub{display:flex;gap:.4rem;margin-bottom:1.2rem}
.tabs-sub button{padding:.45rem .9rem;border-radius:999px;border:1px solid rgba(251,246,231,.18);background:none;color:rgba(251,246,231,.6);cursor:pointer;font-size:.82rem}
.tabs-sub button.on{background:var(--amber);border-color:var(--amber);color:#1A1206}
.mono{font-variant-numeric:tabular-nums}
.hr{height:1px;background:rgba(251,246,231,.1);margin:1.4rem 0}
.pub-hr{height:1px;background:var(--ink-14);margin:1.4rem 0}

/* ============ RESPONSIVO ============ */
@media (min-width:720px){
  .quotes{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1fr 1fr;gap:3.4rem}
  .foot-grid{grid-template-columns:1.4fr 1fr 1fr}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .pay-grid{max-width:520px}
  .modal-bg{place-items:center}
  .modal{border-radius:18px;max-height:86vh}
  .slide{flex-basis:280px}
}
@media (min-width:960px){
  .hero-in{grid-template-columns:.85fr 1.15fr;gap:3.5rem}
  .hero-mark{width:200px;height:200px}
  .menu-item{grid-template-columns:1.1fr 1fr auto;padding:1.7rem .2rem}
  .mi-desc{grid-column:2/3;margin-top:0;text-align:left}
  .mi-side{grid-column:3;grid-row:1/2;flex-direction:row;align-items:center;gap:1.6rem;min-width:250px;justify-content:flex-end}
}
@media (max-width:959px){
  .nav-links{display:none}
  .burger{display:block}
  .hero-mark{margin-bottom:.4rem}
}
/* correções de contexto */
.login .admin{min-height:0;background:none}
.modal-bg.admin{background:rgba(10,9,7,.74);min-height:0}
@media (max-width:560px){
  .day-row{grid-template-columns:1fr;gap:.5rem}
  .day-row .times{justify-self:start}
  .day-row input[type=time]{width:auto;flex:1}
  .pay-grid{grid-template-columns:1fr}
  .pay{grid-template-columns:auto 1fr;display:grid;justify-items:start;text-align:left;padding:1rem 1.1rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;transition-duration:.001s !important}
}

  async load(){
    try{ if(window.storage){ const r=await window.storage.get(this.key); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const s=localStorage.getItem(this.key); if(s) return JSON.parse(s); }catch(e){}
    return null;
  },
  save(db){
    const s=JSON.stringify(db);
    (async()=>{
      try{ if(window.storage){ await window.storage.set(this.key,s); return; } }catch(e){}
      try{ localStorage.setItem(this.key,s); }
      catch(e){ toast('Armazenamento cheio. Exporte um backup e remova fotos antigas.'); }
    })();
  }
};

/* ---------- Disponibilidade ---------- */
function overlap(a1,a2,b1,b2){ return a1 < b2 && b1 < a2; }

function bloqueadoNoDia(k){ return DB.bloqueios.filter(b => k >= b.dataIni && k <= (b.dataFim||b.dataIni)); }

/* Horário do dia: no modo livre vale a faixa ampla; senão, os dias configurados. */
function cfgDia(k){
  const h=DB.horarios;
  if(h.livre||!h.configurado) return {aberto:true, ini:h.livreIni||'08:00', fim:h.livreFim||'20:00'};
  return h.dias[fromKey(k).getDay()];
}
function agendaLivre(){ return DB.horarios.livre || !DB.horarios.configurado; }
function diaAberto(k){
  if(!cfgDia(k).aberto) return false;
  if(bloqueadoNoDia(k).some(b=>b.diaTodo)) return false;
  return true;
}

function slotsDisponiveis(k, dur){
  if(!diaAberto(k)) return [];
  const cfg = cfgDia(k);
  const step = DB.horarios.intervalo, ini = toMin(cfg.ini), fim = toMin(cfg.fim);
  const almoco = DB.horarios.almoco;
  const blocos = bloqueadoNoDia(k).filter(b=>!b.diaTodo).map(b=>[toMin(b.ini),toMin(b.fim)]);
  const ocupados = ativos().filter(a=>a.data===k).map(a=>[toMin(a.hora),toMin(a.hora)+a.duracao]);
  const agora = new Date(); const isHoje = k===hoje();
  const minAgora = agora.getHours()*60+agora.getMinutes()+15; // 15 min de antecedência
  const out=[];
  for(let t=ini; t+dur<=fim; t+=step){
    const e=t+dur;
    if(isHoje && t < minAgora) continue;
    if(almoco.ativo && overlap(t,e,toMin(almoco.ini),toMin(almoco.fim))) continue;
    if(blocos.some(b=>overlap(t,e,b[0],b[1]))) continue;
    if(ocupados.some(o=>overlap(t,e,o[0],o[1]))) continue;
    out.push(toHM(t));
  }
  return out;
}

function proximosDias(n, from){
  const base = from ? fromKey(from) : new Date(); const out=[];
  for(let i=0;i<n;i++){ const d=new Date(base); d.setDate(base.getDate()+i); out.push(key(d)); }
  return out;
}

/* ---------- Carrossel + lightbox ---------- */
function carScroll(dir){ const c=$('#car'); if(c) c.scrollBy({left:dir*(c.querySelector('.slide').offsetWidth+14),behavior:'smooth'}); }
function carGo(i){ const c=$('#car'); if(!c) return; const s=c.querySelectorAll('.slide')[i]; if(s) c.scrollTo({left:s.offsetLeft-c.offsetLeft,behavior:'smooth'}); }
function carSync(){
  const c=$('#car'); if(!c) return;
  const slides=[...c.querySelectorAll('.slide')], mid=c.scrollLeft+c.clientWidth/2;
  let best=0,bd=1e9;
  slides.forEach((s,i)=>{ const d=Math.abs(s.offsetLeft-c.offsetLeft+s.offsetWidth/2-mid); if(d<bd){bd=d;best=i;} });
  document.querySelectorAll('#dots .dot').forEach((d,i)=>d.classList.toggle('on',i===best));
}
var lbIdx=0;
function lightbox(i){
  const pf=DB.portfolio.filter(p=>p.ativo); if(!pf.length) return; lbIdx=(i+pf.length)%pf.length;
  const p=pf[lbIdx];
  let el=$('#lb');
  if(!el){ el=document.createElement('div'); el.id='lb'; el.className='lb'; el.onclick=e=>{ if(e.target===el) closeLb(); }; document.body.appendChild(el); document.addEventListener('keydown',lbKeys); }
  el.innerHTML=`<button class="car-btn lb-x" onclick="closeLb()" aria-label="Fechar">${I.x}</button>
    <button class="car-btn lb-arrow l" onclick="lightbox(${lbIdx-1})" aria-label="Anterior">${I.left}</button>
    <button class="car-btn lb-arrow r" onclick="lightbox(${lbIdx+1})" aria-label="Próxima">${I.right}</button>
    <figure style="margin:0"><img src="${p.image}" alt="${esc(p.caption)}">
    ${p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:''}
    ${p.instagramUrl?`<figcaption><a class="btn btn-ghost btn-sm" style="margin-top:.8rem;border-color:rgba(251,246,231,.3);color:#EFE9D9" href="${p.instagramUrl}" target="_blank" rel="noopener">Ver no Instagram</a></figcaption>`:''}</figure>`;
  document.body.style.overflow='hidden';
}
function closeLb(){ const el=$('#lb'); if(el) el.remove(); document.body.style.overflow=''; document.removeEventListener('keydown',lbKeys); }
function lbKeys(e){ if(e.key==='Escape') closeLb(); if(e.key==='ArrowRight') lightbox(lbIdx+1); if(e.key==='ArrowLeft') lightbox(lbIdx-1); }

  return `<div class="steps">${PASSOS.map((p,i)=>`<div class="step-pip ${i<B.step?'done':''} ${i===B.step?'now':''}"><div class="bar"></div><span>${p}</span></div>`).join('')}</div>`;

function renderStage(){
  const w=$('#stage-wrap'); if(!w) return;
  if(B.feito){ w.innerHTML=stageDone(); return; }
  const back = B.step>0 ? `<button class="link-back" onclick="stepGo(${B.step-1})">${I.left} ${PASSOS[B.step-1]}</button>` : '';

  w.innerHTML = progress()+back+`<div class="stage">${[stageServico,stageData,stageHora,stagePagamento,stageDados,stageResumo][B.step]()}</div>`+rodape;
  const f=w.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true});
  window.scrollTo({top:0,behavior:'smooth'});
}
function stepGo(n){ B.step=n; renderStage(); }

/* 2 — data */
function stageData(){
  const dur=svcDur(servico(B.servicoId));
  const dias=proximosDias(7,B.base);
  const d0=fromKey(dias[0]);
  const podeVoltar = B.base>hoje();
  return `<div class="step-head"><h2>Escolha uma data</h2><p>${esc(servico(B.servicoId).nome)} · ${durTxt(dur)}</p></div>
  <div class="week-nav">
    <b>${MES[d0.getMonth()]} ${d0.getFullYear()}</b>
    <span style="display:flex;gap:.4rem">
      <button class="mini-btn" ${podeVoltar?'':'disabled'} onclick="semana(-7)" aria-label="Semana anterior">${I.left}</button>
      <button class="mini-btn" onclick="semana(7)" aria-label="Próxima semana">${I.right}</button>
    </span>
  </div>
  <div class="week">
    ${dias.map(k=>{
      const d=fromKey(k), livre=diaAberto(k)?slotsDisponiveis(k,dur).length:0;
      const off=!livre;
      return `<button class="day ${off?'off':''} ${B.data===k?'on':''}" ${off?'disabled':''} onclick="pickData('${k}')">
        <em>${DOW3[d.getDay()]}</em><b>${String(d.getDate()).padStart(2,'0')}</b>
        <small>${off?(diaAberto(k)?'cheio':'fechado'):livre+' livre'+(livre>1?'s':'')}</small></button>`;
    }).join('')}
  </div>
  <p style="margin-top:1.2rem;font-size:.88rem;color:var(--ink-45)">${agendaLivre()?'Escolha o melhor dia para você — o barbeiro confirma o horário em seguida.':'Dias fechados, feriados e bloqueios já aparecem indisponíveis.'}</p>`;
}
function semana(n){ const d=fromKey(B.base); d.setDate(d.getDate()+n); const k=key(d); B.base = k<hoje()?hoje():k; renderStage(); }
function pickData(k){ B.data=k; B.hora=null; setTimeout(()=>stepGo(2),140); renderStage(); }

/* 3 — horário */
function stageHora(){
  const dur=svcDur(servico(B.servicoId));
  const list=slotsDisponiveis(B.data,dur);
  return `<div class="step-head"><h2>Escolha seu horário</h2><p>${longDate(B.data)} · ${durTxt(dur)} de atendimento</p></div>
  ${list.length?`<div class="slots">${list.map(h=>`<button class="slot ${B.hora===h?'on':''}" onclick="pickHora('${h}')">${h}</button>`).join('')}</div>
  ${agendaLivre()?`<p style="margin-top:1.2rem;font-size:.88rem;color:var(--ink-45)">O horário fica reservado como solicitação até o barbeiro confirmar.</p>`:''}`
  :`<div class="empty">${I.clock}<p>Não há horários livres nesse dia.</p><button class="btn btn-ghost btn-sm" onclick="stepGo(1)">Escolher outra data</button></div>`}`;
}
function pickHora(h){ B.hora=h; setTimeout(()=>stepGo(3),140); renderStage(); }

/* 4 — pagamento */
function stagePagamento(){
  const ops=[['PIX',I.pix],['CARTÃO',I.card],['DINHEIRO',I.cash]];
  return `<div class="step-head"><h2>Como você pretende pagar?</h2><p>O pagamento é feito na barbearia, no dia do atendimento.</p></div>
  <div class="pay-grid">${ops.map(o=>`<button class="pay ${B.pagamento===o[0]?'on':''}" onclick="pickPag('${o[0]}')">${o[1]}<span>${o[0]}</span></button>`).join('')}</div>`;
}
function pickPag(p){ B.pagamento=p; setTimeout(()=>stepGo(4),140); renderStage(); }

/* 5 — dados */
function stageDados(){
  return `<div class="step-head"><h2>Seus dados</h2><p>Para o barbeiro confirmar seu horário.</p></div>
  <div class="field" id="f-nome"><label for="i-nome">Nome</label><input id="i-nome" data-focus value="${esc(B.nome)}" placeholder="Como podemos te chamar" autocomplete="name"><div class="err">Informe seu nome.</div></div>
  <div class="field" id="f-tel"><label for="i-tel">Telefone / WhatsApp</label><input id="i-tel" value="${esc(B.telefone)}" placeholder="(11) 90000-0000" inputmode="tel" autocomplete="tel" oninput="this.value=maskPhone(this.value)"><div class="err">Informe um telefone com DDD.</div></div>
  <div class="field"><label for="i-obs">Observação (opcional)</label><textarea id="i-obs" placeholder="Ex.: gostaria de manter o comprimento.">${esc(B.obs)}</textarea></div>
  <div class="nav-btns"><button class="btn btn-ghost" onclick="stepGo(3)">${I.left}</button>
    <button class="btn btn-primary" onclick="submitDados()">Continuar</button></div>`;
}
function submitDados(){
  B.nome=$('#i-nome').value.trim(); B.telefone=$('#i-tel').value.trim(); B.obs=$('#i-obs').value.trim();
  const okNome=B.nome.length>=2, okTel=onlyDigits(B.telefone).length>=10;
  $('#f-nome').classList.toggle('bad',!okNome); $('#f-tel').classList.toggle('bad',!okTel);
  if(okNome&&okTel) stepGo(5);
}

/* 6 — resumo */
function stageResumo(){
  const s=servico(B.servicoId);
  const rows=[['Cliente',esc(B.nome)],['Serviço',esc(s.nome)],['Data',brDate(B.data)],['Horário',B.hora],
    ['Duração',durTxt(svcDur(s))],['Pagamento',B.pagamento],['Telefone',esc(B.telefone)]];
  if(s.preco!=null) rows.splice(2,0,['Valor',money(s.preco)]);
  if(B.obs) rows.push(['Observação',esc(B.obs)]);
  return `<div class="step-head"><h2>Confira seu agendamento</h2><p>Se estiver tudo certo, é só enviar a solicitação.</p></div>
  <div class="summary">${rows.map(r=>`<div class="sum-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  <div class="nav-btns"><button class="btn btn-ghost" onclick="stepGo(4)">${I.left}</button>
    <button class="btn btn-primary" onclick="confirmar()">Confirmar solicitação</button></div>
  <p style="margin-top:1rem;font-size:.86rem;color:var(--ink-45)">A solicitação vai para o barbeiro. Você recebe a confirmação do horário em seguida.</p>`;
}

function confirmar(){
  const s=servico(B.servicoId);
  const livre=slotsDisponiveis(B.data,svcDur(s));
  if(!livre.includes(B.hora)){ toast('Esse horário acabou de ser ocupado. Escolha outro.'); B.hora=null; stepGo(2); return; }
  const a={
    id:uid(), codigo:'DB-'+uid().slice(0,4).toUpperCase(),
    cliente:B.nome, telefone:B.telefone, telDigits:onlyDigits(B.telefone),
    servicoId:B.servicoId, data:B.data, hora:B.hora, duracao:svcDur(s),
    pagamento:B.pagamento, obs:B.obs, status:'pendente', criadoEm:new Date().toISOString()
  };
  DB.agendamentos.push(a); save();
  try{ localStorage.setItem('dhow_last_phone',a.telDigits); }catch(e){}
  B.feito=a; renderStage();
}

function stageDone(){
  const a=B.feito, s=servico(a.servicoId), msg=montarMensagem(a), dest=canalDestino(msg);
  return `<div class="done-card">
    <div class="done-mark">${I.check}</div>
    <h2>Solicitação enviada</h2>
    <p style="color:var(--ink-70);margin-top:.6rem">Sua solicitação foi registrada. Agora é só mandar a mensagem para a ${esc(DB.config.nome)} confirmar o horário.</p>
    <div class="summary" style="text-align:left;margin:1.6rem 0">
      <div class="sum-row"><span>Serviço</span><b>${esc(s.nome)}</b></div>
      <div class="sum-row"><span>Data</span><b>${brDate(a.data)}</b></div>
      <div class="sum-row"><span>Horário</span><b>${a.hora}</b></div>
      <div class="sum-row"><span>Pagamento</span><b>${a.pagamento}</b></div>
      <div class="sum-row"><span>Código</span><b>${a.codigo}</b></div>
    </div>
    ${dest.auto?'':`<div class="notice" style="text-align:left">${I.info}<div>O ${dest.nome} não permite envio automático de mensagem por um site. Copie o texto abaixo e cole na conversa que vai abrir.</div></div>`}
    <div class="msg-box" id="msg">${esc(msg)}</div>
    <div class="nav-btns" style="flex-direction:column">
      <a class="btn btn-primary btn-block" href="${dest.url}" target="_blank" rel="noopener" onclick="copyMsg(1)">Enviar pelo ${dest.nome}</a>
      <button class="btn btn-ghost btn-block" onclick="copyMsg()">${I.copy} Copiar mensagem</button>
      <a class="btn btn-ghost btn-block" href="#/meus">Ver meu agendamento</a>
      <a class="btn btn-ghost btn-block" href="#/">Voltar para o início</a>
    </div>
    <p style="margin-top:1.2rem;font-size:.88rem;color:var(--ink-45)">Aguarde a confirmação do barbeiro.</p>
  </div>`;
}
function copyMsg(silent){
  const t=$('#msg').textContent;
  const done=()=>{ if(!silent) toast('Mensagem copiada'); };
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(t,cb){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');}catch(e){} ta.remove(); cb&&cb(); }

/* =======================================================================
   MEUS AGENDAMENTOS (cliente)
   ======================================================================= */
var meusTel = (()=>{ try{ return localStorage.getItem('dhow_last_phone')||''; }catch(e){ return ''; } })();
function viewMeus(){
  return navBar()+`<main class="page">
    <div class="botanic" style="top:0;right:-120px;width:240px;opacity:.25">${branch('olive')}</div>
    <div class="shell" style="max-width:660px">
      <h2 style="margin-bottom:.4rem">Meus agendamentos</h2>
      <p style="color:var(--ink-70)">Digite o telefone usado no agendamento.</p>
      <div class="field" style="margin-top:1.2rem">
        <label for="i-busca">Telefone</label>
        <input id="i-busca" value="${esc(maskPhone(meusTel))}" placeholder="(11) 90000-0000" inputmode="tel" oninput="this.value=maskPhone(this.value)" onkeydown="if(event.key==='Enter')buscarMeus()">
      </div>
      <button class="btn btn-primary btn-block" onclick="buscarMeus()">Buscar</button>
      <div id="meus-res" style="margin-top:2rem"></div>
    </div>
  </main>`+footer();
}
function buscarMeus(){
  const tel=onlyDigits($('#i-busca').value); const box=$('#meus-res');
  if(tel.length<10){ box.innerHTML=`<div class="empty">${I.info}<p>Informe o telefone completo com DDD.</p></div>`; return; }
  meusTel=tel; try{ localStorage.setItem('dhow_last_phone',tel); }catch(e){}
  const list=DB.agendamentos.filter(a=>a.telDigits===tel).sort((x,y)=>(x.data+x.hora).localeCompare(y.data+y.hora));
  if(!list.length){ box.innerHTML=`<div class="empty">${I.cal}<p>Nenhum agendamento encontrado para esse telefone.</p><a class="btn btn-primary btn-sm" href="#/agendar">Agendar agora</a></div>`; return; }
  const agora=hoje();
  const prox=list.filter(a=>a.data>=agora&&(a.status==='pendente'||a.status==='confirmado'||a.status==='reagendamento'));
  const hist=list.filter(a=>!prox.includes(a)).reverse();
  box.innerHTML = (prox.length?`<h3 style="margin-bottom:.9rem">Próximos</h3>${prox.map(a=>apptCard(a)).join('')}`:
    `<div class="empty">${I.cal}<p>Você não tem agendamento em aberto.</p><a class="btn btn-primary btn-sm" href="#/agendar">Agendar agora</a></div>`)
    + (hist.length?`<h3 style="margin:2rem 0 .9rem">Histórico</h3>${hist.map(a=>apptCard(a)).join('')}`:'');
}
function apptCard(a){
  const s=servico(a.servicoId);
  return `<div class="appt" onclick="detalhe('${a.id}')">
    <div class="appt-top"><div class="appt-when">${brDate(a.data)} · ${a.hora}</div>${tag(a.status)}</div>
    <div class="appt-meta"><span>✂️ ${esc(s?s.nome:'-')}</span><span>💳 ${a.pagamento}</span><span class="mono">${a.codigo}</span></div>
  </div>`;
}
function detalhe(id){
  const a=DB.agendamentos.find(x=>x.id===id); if(!a) return; const s=servico(a.servicoId);
  const rows=[['Código',a.codigo],['Cliente',esc(a.cliente)],['Telefone',esc(a.telefone)],['Serviço',esc(s?s.nome:'-')],
    ['Data',brDate(a.data)],['Horário',`${a.hora} · ${durTxt(a.duracao)}`],['Pagamento',a.pagamento],
    ...(s&&s.preco!=null?[['Valor',money(s.preco)]]:[]), ...(a.obs?[['Observação',esc(a.obs)]]:[]), ['Status',tag(a.status)]];
  const podeCancelar = a.status==='pendente'||a.status==='confirmado';
  openModal(`<h3>Detalhes do agendamento</h3>
    <div class="summary">${rows.map(r=>`<div class="sum-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
    ${a.status==='reagendamento'?`<div class="notice">${I.info}<div>O barbeiro pediu para você escolher outro horário.</div></div>`:''}
    <div class="nav-btns" style="flex-direction:column">
      ${a.status==='reagendamento'?`<a class="btn btn-primary btn-block" href="#/agendar">Escolher outro horário</a>`:''}
      ${podeCancelar?`<button class="btn btn-ghost btn-block" onclick="cancelarCliente('${a.id}')">Cancelar agendamento</button>`:''}
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Fechar</button>
    </div>`);
}
function cancelarCliente(id){
  const a=DB.agendamentos.find(x=>x.id===id); if(!a) return;
  a.status='cancelado'; save(); closeModal(); buscarMeus(); toast('Agendamento cancelado');
}

/* ---------- Modal ---------- */
function openModal(html){
  let bg=$('#modal'); if(!bg){ bg=document.createElement('div'); bg.id='modal'; bg.className='modal-bg'; document.body.appendChild(bg); }
  bg.className='modal-bg'+(document.body.dataset.ctx==='admin'?' admin':'');
  bg.innerHTML=`<div class="modal" style="position:relative"><button class="mini-btn modal-x" onclick="closeModal()" aria-label="Fechar">${I.x}</button>${html}</div>`;
  bg.onclick=e=>{ if(e.target===bg) closeModal(); };
  document.body.style.overflow='hidden';
}
function closeModal(){ const m=$('#modal'); if(m) m.remove(); document.body.style.overflow=''; }

/* =======================================================================
   PAINEL DO BARBEIRO
   ======================================================================= */
var A = {auth:false, tab:'dashboard', vista:'dia', dia:hoje(), mes:new Date(), filtro:'todos'};
try{ A.auth = sessionStorage.getItem('dhow_admin')==='1'; }catch(e){}

const TABS=[['dashboard','Dashboard'],['agenda','Agenda'],['agendamentos','Agendamentos'],['servicos','Serviços'],
  ['horarios','Horários'],['bloqueios','Bloqueios'],['clientes','Clientes'],['portfolio','Portfólio'],['config','Configurações']];

function viewAdmin(){
  document.body.dataset.ctx='admin';
  if(!A.auth) return `<div class="login"><div class="login-box">
      <img src="${LOGO}" alt="Dhow Barber">
      <h2 style="color:var(--cream)">Área do barbeiro</h2>
      <p style="color:rgba(251,246,231,.5);margin-bottom:1.6rem">Entre para gerenciar a agenda.</p>
      <div class="admin">
        <div class="field"><label for="i-pw">Senha</label><input id="i-pw" type="password" data-focus onkeydown="if(event.key==='Enter')login()"></div>
        <button class="btn btn-primary btn-block" onclick="login()">Entrar</button>
        <a class="btn btn-ghost btn-block" style="margin-top:.6rem" href="#/">Voltar ao site</a>
        <p id="pw-err" style="color:#D9705C;font-size:.86rem;margin-top:.9rem;display:none">Senha incorreta.</p>
      </div></div></div>`;

  return `<div class="admin">
    <div class="adm-top"><div class="shell adm-top-in">
      <img src="${LOGO}" alt=""><b>Painel Dhow</b>
      <span class="sp"></span>
      <a class="btn btn-ghost btn-sm" href="#/">Ver site</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
    </div>
    <div class="shell"><div class="adm-tabs">${TABS.map(t=>`<button class="adm-tab ${A.tab===t[0]?'on':''}" onclick="admTab('${t[0]}')">${t[1]}</button>`).join('')}</div></div>
    </div>
    <div class="adm-body"><div class="shell" id="adm-view"></div></div>

}
function login(){
  const v=$('#i-pw').value;
  if(v===DB.config.senha){ A.auth=true; try{sessionStorage.setItem('dhow_admin','1');}catch(e){} render(); }
  else $('#pw-err').style.display='block';
}
function logout(){ A.auth=false; try{sessionStorage.removeItem('dhow_admin');}catch(e){} location.hash='#/'; }
function admTab(t){ A.tab=t; renderAdmView(); document.querySelectorAll('.adm-tab').forEach((b,i)=>b.classList.toggle('on',TABS[i][0]===t)); window.scrollTo({top:0}); }
function renderAdmView(){
  const el=$('#adm-view'); if(!el) return;
  el.innerHTML = ({dashboard:admDashboard,agenda:admAgenda,agendamentos:admAgendamentos,servicos:admServicos,
    horarios:admHorarios,bloqueios:admBloqueios,clientes:admClientes,portfolio:admPortfolio,config:admConfig})[A.tab]();
}

/* ---- Dashboard ---- */
function admDashboard(){
  const k=hoje();
  const doDia=DB.agendamentos.filter(a=>a.data===k&&a.status!=='cancelado'&&a.status!=='recusado').sort((x,y)=>x.hora.localeCompare(y.hora));
  const agora=toHM(new Date().getHours()*60+new Date().getMinutes());
  const prox=doDia.find(a=>a.hora>=agora&&a.status!=='concluido');
  const pend=DB.agendamentos.filter(a=>a.status==='pendente');
  const feitos=DB.agendamentos.filter(a=>a.status==='concluido').length;
  const livres=slotsDisponiveis(k,DB.horarios.intervalo).length;
  const semPreco=DB.servicos.filter(s=>s.ativo&&s.preco==null).length;
  const semDur=DB.servicos.filter(s=>s.ativo&&!s.duracao).length;
  const checks=[
    ...(agendaLivre()?[]:[[DB.horarios.configurado,'Definir dias e horários de atendimento','horarios']]),
    [semPreco===0,`Cadastrar o preço dos serviços${semPreco?` (${semPreco} sem valor)`:''}`,'servicos'],
    [semDur===0,`Definir a duração dos serviços${semDur?` (${semDur} sem duração)`:''}`,'servicos'],
    [DB.config.senha!=='dhow2026','Trocar a senha padrão do painel','config'],
    [DB.portfolio.filter(p=>p.ativo).length>=4,'Adicionar mais fotos ao portfólio','portfolio']
  ];
  const pendentes=checks.filter(c=>!c[0]);
  return `<h2>Olá, Dhow 👋</h2><p class="adm-sub">${longDate(k)}</p>
  <div class="grid-4" style="margin-bottom:1.6rem">
    <div class="card stat"><b>${doDia.length}</b><span>Hoje</span></div>
    <div class="card stat ${pend.length?'hot':''}"><b>${pend.length}</b><span>Pendentes</span></div>
    <div class="card stat"><b>${feitos}</b><span>Realizados</span></div>
    <div class="card stat"><b>${livres}</b><span>Livres hoje</span></div>
  </div>
  ${pendentes.length?`<div class="card" style="margin-bottom:1.6rem">
    <h3 style="color:var(--cream);margin-bottom:.6rem">Para deixar tudo no ponto</h3>
    ${checks.map(c=>`<div class="check ${c[0]?'ok':''}"><i class="bx">${c[0]?I.check:''}</i>
      <span>${c[1]}</span>${c[0]?'':`<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="admTab('${c[2]}')">Abrir</button>`}</div>`).join('')}
  </div>`:''}
  <div class="card" style="margin-bottom:1.6rem">
    <div class="foot-title" style="color:rgba(251,246,231,.45)">Próximo cliente</div>
    ${prox?`<div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <b style="font-family:var(--serif);font-size:2.2rem">${prox.hora}</b>
      <div><div style="font-size:1.15rem">${esc(prox.cliente)}</div>
      <div class="row-meta">${esc(servico(prox.servicoId)?.nome||'')} · ${prox.pagamento}</div></div>
      <span style="margin-left:auto">${tag(prox.status)}</span></div>`
    :`<p style="color:rgba(251,246,231,.45);margin:0">Nenhum atendimento à frente hoje.</p>`}
  </div>
  <h3 style="color:var(--cream);margin-bottom:.8rem">Agendamentos de hoje</h3>
  ${doDia.length?`<div class="adm-list">${doDia.map(a=>admRow(a)).join('')}</div>`
  :`<div class="empty">${I.cal}<p>Nada marcado para hoje.</p></div>`}`;
}

function admRow(a){
  const s=servico(a.servicoId);
  return `<div class="row clickable" onclick="admDetalhe('${a.id}')">
    <div class="row-top"><div><div class="row-time">${a.hora}</div>
      <div style="font-size:1.05rem;margin-top:.15rem">${esc(a.cliente)}</div>
      <div class="row-meta"><span>✂️ ${esc(s?s.nome:'-')}</span><span>💳 ${a.pagamento}</span><span>📱 ${esc(a.telefone)}</span>${a.obs?`<span>📝 ${esc(a.obs)}</span>`:''}</div>
    </div>${tag(a.status)}</div></div>`;
}

/* ---- Agenda ---- */
function admAgenda(){
  const v=A.vista;
  let body='';
  if(v==='dia'){
    const list=DB.agendamentos.filter(a=>a.data===A.dia).sort((x,y)=>x.hora.localeCompare(y.hora));
    body=`<div class="week-nav" style="margin-bottom:1rem">
      <b style="color:var(--cream);text-transform:none">${longDate(A.dia)}</b>
      <span style="display:flex;gap:.4rem">
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agDia(-1)">${I.left}</button>
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agDia(1)">${I.right}</button></span></div>
      ${list.length?`<div class="adm-list">${list.map(a=>admRow(a)).join('')}</div>`:`<div class="empty">${I.cal}<p>Nenhum agendamento nesse dia.</p></div>`}`;
  }
  if(v==='semana'){
    const dias=proximosDias(7,A.dia);
    body=`<div class="week-nav" style="margin-bottom:1rem">
      <b style="color:var(--cream);text-transform:none">${brDate(dias[0])} — ${brDate(dias[6])}</b>
      <span style="display:flex;gap:.4rem">
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agDia(-7)">${I.left}</button>
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agDia(7)">${I.right}</button></span></div>
      <div class="agenda-week">${dias.map(k=>{
        const d=fromKey(k), list=DB.agendamentos.filter(a=>a.data===k).sort((x,y)=>x.hora.localeCompare(y.hora));
        return `<div class="agenda-col"><h5>${DOW3[d.getDay()]}<b>${String(d.getDate()).padStart(2,'0')}</b></h5>
        ${list.map(a=>`<div class="chip s-${a.status}" onclick="admDetalhe('${a.id}')"><b>${a.hora}</b><span>${esc(a.cliente)}</span><span>${esc(servico(a.servicoId)?.nome||'')}</span></div>`).join('')||'<div style="opacity:.25;font-size:.72rem;text-align:center">—</div>'}
        </div>`;}).join('')}</div>`;
  }
  if(v==='mes'){
    const m=A.mes, first=new Date(m.getFullYear(),m.getMonth(),1), start=new Date(first);
    start.setDate(1-first.getDay());
    const cells=[]; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
    body=`<div class="week-nav" style="margin-bottom:1rem">
      <b style="color:var(--cream)">${MES[m.getMonth()]} ${m.getFullYear()}</b>
      <span style="display:flex;gap:.4rem">
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agMes(-1)">${I.left}</button>
        <button class="mini-btn" style="border-color:rgba(251,246,231,.2);color:var(--cream)" onclick="agMes(1)">${I.right}</button></span></div>
      <div class="month">${DOW3.map(d=>`<div class="mdow">${d}</div>`).join('')}
      ${cells.map(d=>{ const k=key(d), n=DB.agendamentos.filter(a=>a.data===k&&a.status!=='cancelado'&&a.status!=='recusado').length;
        return `<div class="mcell ${d.getMonth()!==m.getMonth()?'out':''} ${k===hoje()?'today':''}" onclick="agIrDia('${k}')">
          <b>${d.getDate()}</b>${n?`<i>${n} agend.</i>`:''}</div>`;}).join('')}</div>`;

function agVista(v){ A.vista=v; renderAdmView(); }
function agDia(n){ const d=fromKey(A.dia); d.setDate(d.getDate()+n); A.dia=key(d); renderAdmView(); }
function agMes(n){ A.mes=new Date(A.mes.getFullYear(),A.mes.getMonth()+n,1); renderAdmView(); }
function agIrDia(k){ A.dia=k; A.vista='dia'; renderAdmView(); }

    <div style="font-size:1.05rem;margin-top:.15rem">${esc(a.cliente)}</div>

function admFiltro(f){ A.filtro=f; renderAdmView(); }

function admDetalhe(id){
  const a=DB.agendamentos.find(x=>x.id===id); if(!a) return; const s=servico(a.servicoId);
  const rows=[['Código',a.codigo],['Cliente',esc(a.cliente)],['Telefone',esc(a.telefone)],['Serviço',esc(s?s.nome:'-')],
    ['Data',brDate(a.data)],['Horário',`${a.hora} · ${durTxt(a.duracao)}`],['Pagamento',a.pagamento],
    ...(a.obs?[['Observação',esc(a.obs)]]:[]),['Status',tag(a.status)]];
  const acoes={
    pendente:[['confirmado','Confirmar','btn-primary'],['reagendamento','Pedir reagendamento','btn-ghost'],['recusado','Recusar','btn-ghost']],
    confirmado:[['concluido','Marcar como concluído','btn-primary'],['cancelado','Cancelar','btn-ghost']],
    reagendamento:[['confirmado','Confirmar mesmo assim','btn-primary'],['cancelado','Cancelar','btn-ghost']],
    recusado:[['pendente','Reabrir','btn-ghost']],cancelado:[['pendente','Reabrir','btn-ghost']],concluido:[]
  }[a.status]||[];
  const wa=`https://wa.me/${a.telDigits.length>11?a.telDigits:'55'+a.telDigits}`;
  openModal(`<h3>${esc(a.cliente)}</h3>
    <div class="summary" style="background:transparent">${rows.map(r=>`<div class="sum-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
    <div class="nav-btns" style="flex-direction:column">
      ${acoes.map(x=>`<button class="btn ${x[2]} btn-block" onclick="setStatus('${a.id}','${x[0]}')">${x[1]}</button>`).join('')}
      <a class="btn btn-ghost btn-block" href="${wa}" target="_blank" rel="noopener">Falar no WhatsApp</a>
      <button class="btn btn-ghost btn-block" onclick="excluirAgend('${a.id}')">Excluir registro</button>
    </div>`);
}
function setStatus(id,st){ const a=DB.agendamentos.find(x=>x.id===id); a.status=st; save(); closeModal(); renderAdmView(); toast('Status: '+STATUS_LABEL[st]); }
function excluirAgend(id){ if(!confirm('Excluir este agendamento?')) return;
  DB.agendamentos=DB.agendamentos.filter(x=>x.id!==id); save(); closeModal(); renderAdmView(); toast('Agendamento excluído'); }

  openModal(`<h3>${id?'Editar serviço':'Novo serviço'}</h3>

/* ---- Portfólio ---- */
function admPortfolio(){
  return `<h2>Portfólio</h2><p class="adm-sub">As fotos ativas aparecem no carrossel do site, nesta ordem.</p>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem">
    <button class="btn btn-primary btn-sm" onclick="document.getElementById('pf-file').click()">${I.plus} Enviar foto</button>
    <button class="btn btn-ghost btn-sm" onclick="editFoto()">Adicionar por link</button>
    <input type="file" id="pf-file" accept="image/*" multiple style="display:none" onchange="uploadFotos(this)">
  </div>
  ${DB.portfolio.length?`<div class="pf-admin">${DB.portfolio.map((p,i)=>`<div class="pf-thumb ${p.ativo?'':'off'}">
    <img src="${p.image}" alt="${esc(p.caption)}">
    <div class="pf-tools">
      <button onclick="moverFoto(${i},-1)" title="Subir" ${i?'':'disabled style="opacity:.3"'}>${I.up}</button>
      <button onclick="moverFoto(${i},1)" title="Descer" ${i<DB.portfolio.length-1?'':'disabled style="opacity:.3"'}>${I.down}</button>
      <button onclick="toggleFoto('${p.id}')" title="Ativar/desativar">${I.eye}</button>
      <button onclick="editFoto('${p.id}')" title="Editar">${I.edit}</button>
      <button onclick="rmFoto('${p.id}')" title="Excluir">${I.trash}</button>
    </div></div>`).join('')}</div>`:`<div class="empty">${I.info}<p>Nenhuma foto cadastrada.</p></div>`}
  <p style="color:rgba(251,246,231,.4);font-size:.85rem;margin-top:1.4rem">Estrutura pronta para trocar essa fonte local pela API oficial do Instagram no futuro — cada foto guarda imagem, legenda e link da publicação.</p>`;
}
function uploadFotos(input){
  [...input.files].forEach(f=>{ const r=new FileReader();
    r.onload=()=>{ DB.portfolio.push({id:uid(),image:r.result,caption:'',instagramUrl:DB.config.instagram,ativo:true}); save(); renderAdmView(); };
    r.readAsDataURL(f); });
  input.value='';
}
function editFoto(id){
  const p=id?DB.portfolio.find(x=>x.id===id):{image:'',caption:'',instagramUrl:DB.config.instagram};
  openModal(`<h3>${id?'Editar foto':'Adicionar foto por link'}</h3>
    ${id?'':`<div class="field"><label>URL da imagem</label><input id="p-img" value="" placeholder="https://..." data-focus></div>`}
    <div class="field"><label>Legenda</label><input id="p-cap" value="${esc(p.caption)}" placeholder="Ex.: degradê com desenho"></div>
    <div class="field"><label>Link da publicação no Instagram</label><input id="p-url" value="${esc(p.instagramUrl)}"></div>
    <button class="btn btn-primary btn-block" onclick="salvarFoto('${id||''}')">Salvar</button>`);
}
function salvarFoto(id){
  if(id){ const p=DB.portfolio.find(x=>x.id===id); p.caption=$('#p-cap').value.trim(); p.instagramUrl=$('#p-url').value.trim(); }
  else { const url=$('#p-img').value.trim(); if(!url){ toast('Informe a URL'); return; }
    DB.portfolio.push({id:uid(),image:url,caption:$('#p-cap').value.trim(),instagramUrl:$('#p-url').value.trim(),ativo:true}); }
  save(); closeModal(); renderAdmView(); toast('Foto salva');
}
function toggleFoto(id){ const p=DB.portfolio.find(x=>x.id===id); p.ativo=!p.ativo; save(); renderAdmView(); }
function rmFoto(id){ if(!confirm('Remover esta foto?')) return;
  DB.portfolio=DB.portfolio.filter(p=>p.id!==id);
  DB.portfolioRemovidas=[...new Set([...(DB.portfolioRemovidas||[]),id])];
  save(); renderAdmView(); }
function moverFoto(i,d){ const j=i+d; if(j<0||j>=DB.portfolio.length) return;
  const t=DB.portfolio[i]; DB.portfolio[i]=DB.portfolio[j]; DB.portfolio[j]=t; save(); renderAdmView(); }

function salvarConfig(){
  Object.assign(DB.config,{canal:$('#c-canal').value,canalOutro:$('#c-outro').value.trim(),nome:$('#c-nome').value.trim(),
    endereco:$('#c-end').value.trim(),bairro:$('#c-bairro').value.trim(),cidade:$('#c-cidade').value.trim(),cep:$('#c-cep').value.trim(),
    telefone:$('#c-tel').value.trim(),telefoneRaw:'+'+(onlyDigits($('#c-wa').value)||'5511941465958'),
    whatsapp:onlyDigits($('#c-wa').value),instagram:$('#c-ig').value.trim(),senha:$('#c-pw').value||'dhow2026'});
  save(); renderAdmView(); toast('Configurações salvas');
}
function exportar(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`dhow-backup-${hoje()}.json`; a.click();
}
function importar(input){
  const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ DB=JSON.parse(r.result); save(); renderAdmView(); toast('Backup importado'); }catch(e){ toast('Arquivo inválido'); } };
  r.readAsText(f); input.value='';
}

/* =======================================================================
   ROTEADOR
   ======================================================================= */
function render(){
  const raw=location.hash.replace(/^#/,'')||'/';
  const [path,query]=raw.split('?');
  const app=$('#app'); delete document.body.dataset.ctx;
  closeModal(); closeLb();
  if(path.startsWith('/admin')){ app.innerHTML=viewAdmin(); if(A.auth) renderAdmView(); }
  else if(path.startsWith('/agendar')){ app.innerHTML=viewAgendar(query); renderStage(); }
  else if(path.startsWith('/meus')){ app.innerHTML=viewMeus(); if(meusTel) buscarMeus(); }
  else {
    if(B&&B.feito) B=null;
    app.innerHTML=viewHome();
    const car=$('#car'); if(car) car.addEventListener('scroll',carSync,{passive:true});
    const anchor=raw.split('#')[1];
    if(anchor){ const el=document.getElementById(anchor); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),60); }
    else window.scrollTo({top:0});
  }
  const f=app.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true});
}
window.addEventListener('hashchange',render);

/* ---------- Boot ---------- */
(async function init(){
  const saved=await Store.load();
  if(saved){
    DB=Object.assign(seed(),saved);
    DB.config=Object.assign(seed().config,saved.config||{});
    DB.horarios=Object.assign(seed().horarios,saved.horarios||{});
    /* fotos novas do catálogo padrão entram sem apagar as que o barbeiro cadastrou */
    if(saved.portfolio){
      const tem=new Set(saved.portfolio.map(p=>p.id));
      const removidas=new Set(saved.portfolioRemovidas||[]);
      seed().portfolio.forEach(p=>{ if(!tem.has(p.id)&&!removidas.has(p.id)) DB.portfolio.push(p); });
    }
  }
  render();
})();
</script>
